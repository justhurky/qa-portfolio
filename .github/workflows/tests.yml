name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  SUT_BASE_URL: http://127.0.0.1:3000

jobs:
  api:
    name: api tests (java, rest assured)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: start the system under test
        run: |
          node sut/server.js &
          for i in $(seq 1 30); do
            curl -sf "$SUT_BASE_URL/api/health" && break
            sleep 1
          done

      - name: run the gating suite
        run: ./mvnw -B test -Dsut.baseUrl=$SUT_BASE_URL
        working-directory: api-tests

      - name: run the known defect suite
        id: known
        continue-on-error: true
        run: ./mvnw -B test -Pknown-defects -Dtest='*Test#emergencyMayNotBeBackdated+leadTimeAtTheExactBoundaryIsAccepted+oversizedBodyIsRefused' -DfailIfNoSpecifiedTests=false -Dsut.baseUrl=$SUT_BASE_URL
        working-directory: api-tests

      - name: report the known defects
        if: always()
        run: |
          echo "### Known defects" >> $GITHUB_STEP_SUMMARY
          echo "The three cases below fail on purpose and are documented in docs/defects." >> $GITHUB_STEP_SUMMARY
          echo "- DEF-001 an emergency booking can be backdated" >> $GITHUB_STEP_SUMMARY
          echo "- DEF-002 the 15 minute lead time boundary is unreachable" >> $GITHUB_STEP_SUMMARY
          echo "- DEF-003 an oversized body drops the connection instead of answering 413" >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-reports
          path: api-tests/target/surefire-reports

  contract:
    name: contract and concurrency tests (python, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install test dependencies
        run: pip install -r python-tests/requirements.txt

      - name: start the system under test
        run: |
          node sut/server.js &
          for i in $(seq 1 30); do
            curl -sf "$SUT_BASE_URL/api/health" && break
            sleep 1
          done

      - name: run pytest
        run: pytest -v --junit-xml=results/junit.xml
        working-directory: python-tests

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-test-reports
          path: python-tests/results

  ui:
    name: end to end tests (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install playwright
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
        working-directory: ui-tests

      - name: start the system under test
        run: |
          node sut/server.js &
          for i in $(seq 1 30); do
            curl -sf "$SUT_BASE_URL/api/health" && break
            sleep 1
          done

      - name: run playwright
        run: npx playwright test
        working-directory: ui-tests

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            ui-tests/playwright-report
            ui-tests/results
            ui-tests/test-results

  performance:
    name: performance baseline (k6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install k6
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v0.55.0/k6-v0.55.0-linux-amd64.tar.gz \
            | tar -xz --strip-components 1 -C /usr/local/bin k6-v0.55.0-linux-amd64/k6

      - name: start the system under test
        run: |
          node sut/server.js &
          for i in $(seq 1 30); do
            curl -sf "$SUT_BASE_URL/api/health" && break
            sleep 1
          done

      - name: run the load profile
        run: k6 run --summary-export=performance/summary.json performance/booking-load.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-summary
          path: performance/summary.json
