name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  unit:
    name: unit tests (xUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: run the gating suite
        run: dotnet test tests/GroundStation.UnitTests --filter "Category!=KnownDefect" --logger "trx;LogFileName=unit.trx" --results-directory results

      - name: run the known defect suite
        continue-on-error: true
        run: dotnet test tests/GroundStation.UnitTests --filter "Category=KnownDefect" --logger "trx;LogFileName=unit-known-defects.trx" --results-directory results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: results

  integration:
    name: integration tests (xUnit, in-process host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: run the gating suite
        run: dotnet test tests/GroundStation.ApiTests --filter "Category!=KnownDefect" --logger "trx;LogFileName=integration.trx" --results-directory results

      - name: run the known defect suite
        continue-on-error: true
        run: dotnet test tests/GroundStation.ApiTests --filter "Category=KnownDefect" --logger "trx;LogFileName=integration-known-defects.trx" --results-directory results

      - name: report the open defects
        if: always()
        run: |
          echo "### Open defects" >> $GITHUB_STEP_SUMMARY
          echo "These cases fail on purpose and are documented in docs/defects." >> $GITHUB_STEP_SUMMARY
          echo "- DEF-001 an emergency booking can be backdated" >> $GITHUB_STEP_SUMMARY
          echo "- DEF-002 the 15 minute lead time boundary is unreachable over HTTP" >> $GITHUB_STEP_SUMMARY
          echo "- DEF-004 a malformed body bypasses the error contract" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "DEF-003 was fixed and its regression test runs in the gate." >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: results

  ui:
    name: end to end tests (Selenium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: run the browser suite
        run: dotnet test tests/GroundStation.UiTests --logger "trx;LogFileName=ui.trx" --results-directory results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-results
          path: results

  performance:
    name: performance baseline (k6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: install k6
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v0.55.0/k6-v0.55.0-linux-amd64.tar.gz \
            | tar -xz --strip-components 1 -C /usr/local/bin k6-v0.55.0-linux-amd64/k6

      - name: start the system under test
        run: |
          dotnet run --project src/GroundStation.Api --urls http://127.0.0.1:5000 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5000/api/health && break
            sleep 1
          done

      - name: run the load profile
        env:
          SUT_BASE_URL: http://127.0.0.1:5000
        run: k6 run --summary-export=results/k6-summary.json performance/booking-load.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-summary
          path: results
